<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Moved</title>
    
    <!-- 1. The HTML Meta Refresh (Executes in 0 seconds) -->
    <meta http-equiv="refresh" content="0;url=https://docs.cloud.tamu.edu/backstage/">
    
    <!-- 2. The JavaScript Fallback (In case meta refresh fails) -->
    <script type="text/javascript">
        window.location.replace("https://docs.cloud.tamu.edu/backstage/");
    </script>
</head>
<body>
    <!-- 3. The Manual Fallback (For absolute compatibility) -->
    <p>If you are not redirected automatically, please follow this 
       <a href="https://docs.cloud.tamu.edu/backstage/">link to the new page</a>.
    </p>
</body>
</html>
